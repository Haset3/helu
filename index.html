<!DOCTYPE html>
<html lang="en">
<head>

      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20px;
      background: url("hel.jpg") center/cover no-repeat;
      filter: blur(10px);
      transform: scale(1.05);
      z-index: -1;
    }

    .card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 30px 40px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    p {
      margin: 0;
      font-size: 1rem;

    }
  </style>
</head>
